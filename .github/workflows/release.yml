name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach assets to (manual runs)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.target || 'host' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
          - os: windows-latest
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target || 'host' }}

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -n "${TARGET:-}" ]; then
            cargo build --release --features server --target "$TARGET"
          else
            cargo build --release --features server
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS_NAME}" in
            Linux) os=linux ;;
            macOS) os=macos ;;
            *) os="${RUNNER_OS_NAME,,}" ;;
          esac
          case "${RUNNER_ARCH}" in
            X64) arch=x86_64 ;;
            ARM64) arch=arm64 ;;
            *) arch="${RUNNER_ARCH}" ;;
          esac
          asset="wisodown-${os}-${arch}.zip"
          rm -rf dist && mkdir -p dist/scripts dist/docs/guide
          cp target/release/wisodown dist/
          cp target/release/wisodown-server dist/
          cp README.md README.es.md LICENSE THIRD_PARTY_LICENSES dist/
          cp scripts/get-iso.sh scripts/get-iso.ps1 dist/scripts/
          cp docs/guide/technical.md docs/guide/technical.es.md dist/docs/guide/
          (cd dist && zip -r "../${asset}" .)
          echo "ASSET=${asset}" >> "$GITHUB_ENV"
          echo "Packaged ${asset}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          $binDir = if ($env:TARGET) { "target/$($env:TARGET)/release" } else { "target/release" }
          $arch = if ($env:TARGET -match 'i686') { 'i686' } elseif ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x86_64' }
          $asset = "wisodown-windows-$arch.zip"
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist/scripts, dist/docs/guide | Out-Null
          Copy-Item "$binDir/wisodown.exe" dist/
          Copy-Item "$binDir/wisodown-server.exe" dist/
          Copy-Item README.md, README.es.md, LICENSE, THIRD_PARTY_LICENSES dist/
          Copy-Item scripts/get-iso.sh, scripts/get-iso.ps1 dist/scripts/
          Copy-Item docs/guide/technical.md, docs/guide/technical.es.md dist/docs/guide/
          Compress-Archive -Path dist/* -DestinationPath $asset -Force
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Packaged $asset"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: ${{ !inputs.tag }}
